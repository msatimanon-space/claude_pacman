<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1f4e"/>
      <stop offset="100%" style="stop-color:#0d1235"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff6ec7"/>
    </linearGradient>

    <!-- Gold gradient for economist theme -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for circles -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neural network node glow -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Text shadow -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Neural network decoration - left side -->
  <g opacity="0.15">
    <!-- Connections -->
    <line x1="60" y1="120" x2="140" y2="200" stroke="#00d4ff" stroke-width="1"/>
    <line x1="60" y1="120" x2="140" y2="320" stroke="#7b61ff" stroke-width="1"/>
    <line x1="60" y1="300" x2="140" y2="200" stroke="#7b61ff" stroke-width="1"/>
    <line x1="60" y1="300" x2="140" y2="320" stroke="#00d4ff" stroke-width="1"/>
    <line x1="60" y1="480" x2="140" y2="320" stroke="#00d4ff" stroke-width="1"/>
    <line x1="60" y1="480" x2="140" y2="440" stroke="#7b61ff" stroke-width="1"/>
    <line x1="140" y1="200" x2="220" y2="260" stroke="#ff6ec7" stroke-width="1"/>
    <line x1="140" y1="320" x2="220" y2="260" stroke="#00d4ff" stroke-width="1"/>
    <line x1="140" y1="320" x2="220" y2="380" stroke="#7b61ff" stroke-width="1"/>
    <line x1="140" y1="440" x2="220" y2="380" stroke="#ff6ec7" stroke-width="1"/>
    <!-- Nodes -->
    <circle cx="60" cy="120" r="6" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="60" cy="300" r="6" fill="#7b61ff" filter="url(#nodeGlow)"/>
    <circle cx="60" cy="480" r="6" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="140" cy="200" r="5" fill="#7b61ff" filter="url(#nodeGlow)"/>
    <circle cx="140" cy="320" r="5" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="140" cy="440" r="5" fill="#ff6ec7" filter="url(#nodeGlow)"/>
    <circle cx="220" cy="260" r="4" fill="#ff6ec7" filter="url(#nodeGlow)"/>
    <circle cx="220" cy="380" r="4" fill="#7b61ff" filter="url(#nodeGlow)"/>
  </g>

  <!-- Neural network decoration - right side -->
  <g opacity="0.15">
    <line x1="1140" y1="150" x2="1060" y2="230" stroke="#00d4ff" stroke-width="1"/>
    <line x1="1140" y1="150" x2="1060" y2="350" stroke="#7b61ff" stroke-width="1"/>
    <line x1="1140" y1="350" x2="1060" y2="230" stroke="#ff6ec7" stroke-width="1"/>
    <line x1="1140" y1="350" x2="1060" y2="350" stroke="#00d4ff" stroke-width="1"/>
    <line x1="1140" y1="510" x2="1060" y2="350" stroke="#7b61ff" stroke-width="1"/>
    <line x1="1140" y1="510" x2="1060" y2="470" stroke="#00d4ff" stroke-width="1"/>
    <line x1="1060" y1="230" x2="980" y2="290" stroke="#ff6ec7" stroke-width="1"/>
    <line x1="1060" y1="350" x2="980" y2="290" stroke="#00d4ff" stroke-width="1"/>
    <line x1="1060" y1="350" x2="980" y2="410" stroke="#7b61ff" stroke-width="1"/>
    <line x1="1060" y1="470" x2="980" y2="410" stroke="#ff6ec7" stroke-width="1"/>
    <circle cx="1140" cy="150" r="6" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="1140" cy="350" r="6" fill="#7b61ff" filter="url(#nodeGlow)"/>
    <circle cx="1140" cy="510" r="6" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="1060" cy="230" r="5" fill="#ff6ec7" filter="url(#nodeGlow)"/>
    <circle cx="1060" cy="350" r="5" fill="#00d4ff" filter="url(#nodeGlow)"/>
    <circle cx="1060" cy="470" r="5" fill="#7b61ff" filter="url(#nodeGlow)"/>
    <circle cx="980" cy="290" r="4" fill="#7b61ff" filter="url(#nodeGlow)"/>
    <circle cx="980" cy="410" r="4" fill="#ff6ec7" filter="url(#nodeGlow)"/>
  </g>

  <!-- Decorative economic chart line (bottom area) -->
  <g opacity="0.12" transform="translate(150, 480)">
    <polyline points="0,50 40,30 80,45 120,15 160,35 200,10 240,25 280,5 320,20 360,0 400,15 440,8 480,18 520,2 560,12 600,5 640,10 680,3 720,8 760,0 800,5 840,2 880,7"
      fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Candlestick-like bars -->
    <rect x="40" y="25" width="4" height="20" fill="#00d4ff" opacity="0.5"/>
    <rect x="120" y="10" width="4" height="25" fill="#00d4ff" opacity="0.5"/>
    <rect x="200" y="5" width="4" height="20" fill="#ff6ec7" opacity="0.5"/>
    <rect x="280" y="0" width="4" height="18" fill="#00d4ff" opacity="0.5"/>
    <rect x="360" y="-5" width="4" height="22" fill="#00d4ff" opacity="0.5"/>
    <rect x="440" y="3" width="4" height="15" fill="#ff6ec7" opacity="0.5"/>
    <rect x="520" y="-3" width="4" height="18" fill="#00d4ff" opacity="0.5"/>
    <rect x="600" y="0" width="4" height="12" fill="#00d4ff" opacity="0.5"/>
    <rect x="680" y="-2" width="4" height="14" fill="#ff6ec7" opacity="0.5"/>
    <rect x="760" y="-5" width="4" height="10" fill="#00d4ff" opacity="0.5"/>
    <rect x="840" y="-3" width="4" height="12" fill="#00d4ff" opacity="0.5"/>
  </g>

  <!-- Floating data particles -->
  <g opacity="0.2">
    <circle cx="300" cy="100" r="2" fill="#00d4ff" filter="url(#softGlow)"/>
    <circle cx="450" cy="80" r="1.5" fill="#7b61ff" filter="url(#softGlow)"/>
    <circle cx="700" cy="90" r="2" fill="#ff6ec7" filter="url(#softGlow)"/>
    <circle cx="850" cy="110" r="1.5" fill="#00d4ff" filter="url(#softGlow)"/>
    <circle cx="350" cy="550" r="2" fill="#7b61ff" filter="url(#softGlow)"/>
    <circle cx="550" cy="560" r="1.5" fill="#00d4ff" filter="url(#softGlow)"/>
    <circle cx="750" cy="540" r="2" fill="#ff6ec7" filter="url(#softGlow)"/>
    <circle cx="950" cy="555" r="1.5" fill="#7b61ff" filter="url(#softGlow)"/>
  </g>

  <!-- AI Brain icon (center-left) -->
  <g transform="translate(340, 220)" opacity="0.9">
    <!-- Brain outline -->
    <path d="M-30,0 C-30,-25 -15,-40 0,-40 C15,-40 30,-25 30,-5 C40,-10 50,0 45,15 C55,20 50,35 40,35 C40,45 25,50 15,45 C10,55 -10,55 -15,45 C-25,50 -40,45 -40,35 C-50,35 -55,20 -45,15 C-50,0 -40,-10 -30,0Z"
      fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Brain circuit lines -->
    <line x1="-15" y1="-25" x2="-15" y2="35" stroke="#7b61ff" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="-30" x2="5" y2="40" stroke="#7b61ff" stroke-width="0.8" opacity="0.6"/>
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#7b61ff" stroke-width="0.8" opacity="0.6"/>
    <line x1="-25" y1="20" x2="35" y2="20" stroke="#7b61ff" stroke-width="0.8" opacity="0.6"/>
    <!-- Circuit nodes on brain -->
    <circle cx="-15" cy="-10" r="2.5" fill="#00d4ff"/>
    <circle cx="5" cy="5" r="2.5" fill="#ff6ec7"/>
    <circle cx="-15" cy="20" r="2.5" fill="#7b61ff"/>
    <circle cx="5" cy="20" r="2.5" fill="#00d4ff"/>
    <circle cx="20" cy="5" r="2.5" fill="#ff6ec7"/>
  </g>

  <!-- Economics chart icon (center-right) -->
  <g transform="translate(860, 220)" opacity="0.9">
    <!-- Chart axes -->
    <line x1="-35" y1="35" x2="-35" y2="-35" stroke="#ffd700" stroke-width="1.5" filter="url(#glow)"/>
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#ffd700" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Rising trend line -->
    <polyline points="-30,25 -15,15 0,20 10,5 20,-5 30,-25"
      fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
    <!-- Data points -->
    <circle cx="-30" cy="25" r="3" fill="#00d4ff"/>
    <circle cx="-15" cy="15" r="3" fill="#00d4ff"/>
    <circle cx="0" cy="20" r="3" fill="#00d4ff"/>
    <circle cx="10" cy="5" r="3" fill="#7b61ff"/>
    <circle cx="20" cy="-5" r="3" fill="#7b61ff"/>
    <circle cx="30" cy="-25" r="3" fill="#ff6ec7"/>
    <!-- Arrow tip -->
    <polygon points="30,-25 35,-20 28,-18" fill="#ff6ec7"/>
  </g>

  <!-- Top accent line -->
  <rect x="300" y="120" width="600" height="2" rx="1" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Name -->
  <text x="600" y="195" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" filter="url(#textShadow)" letter-spacing="3">
    MONTHIEN SATIMANON
  </text>

  <!-- Divider line -->
  <rect x="420" y="215" width="360" height="1" rx="0.5" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="300" fill="#00d4ff" letter-spacing="8" filter="url(#glow)">
    AI ECONOMIST
  </text>

  <!-- Subtitle / tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="300" fill="#8892b0" letter-spacing="4">
    BRIDGING ARTIFICIAL INTELLIGENCE &amp; ECONOMIC ANALYSIS
  </text>

  <!-- Skill tags -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="2">
    <!-- Tag 1: Machine Learning -->
    <rect x="255" y="350" width="145" height="32" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <text x="327" y="371" text-anchor="middle" fill="#00d4ff" opacity="0.9">MACHINE LEARNING</text>

    <!-- Tag 2: Econometrics -->
    <rect x="420" y="350" width="135" height="32" rx="16" fill="none" stroke="#7b61ff" stroke-width="1" opacity="0.6"/>
    <text x="487" y="371" text-anchor="middle" fill="#7b61ff" opacity="0.9">ECONOMETRICS</text>

    <!-- Tag 3: Data Science -->
    <rect x="575" y="350" width="125" height="32" rx="16" fill="none" stroke="#ff6ec7" stroke-width="1" opacity="0.6"/>
    <text x="637" y="371" text-anchor="middle" fill="#ff6ec7" opacity="0.9">DATA SCIENCE</text>

    <!-- Tag 4: Policy Analysis -->
    <rect x="720" y="350" width="150" height="32" rx="16" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <text x="795" y="371" text-anchor="middle" fill="#ffd700" opacity="0.9">POLICY ANALYSIS</text>
  </g>

  <!-- Bottom section - contact / social hints -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5a6380" letter-spacing="2">
    <text x="600" y="440" text-anchor="middle">
      <tspan fill="#3d4560">///</tspan>  RESEARCH  <tspan fill="#3d4560">|</tspan>  INNOVATION  <tspan fill="#3d4560">|</tspan>  INSIGHTS  <tspan fill="#3d4560">///</tspan>
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="300" y="470" width="600" height="2" rx="1" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Decorative binary/data stream (very subtle) -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#1a2550" opacity="0.3">
    <text x="50" y="600">01001001 11010010 01110100 10101010 01001101 01010100 11001010 01101001</text>
    <text x="650" y="600">10110100 01001011 11010010 01110100 10101010 01001101 01010100 11001010</text>
  </g>

  <!-- Corner accents -->
  <g stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top left -->
    <polyline points="20,50 20,20 50,20"/>
    <!-- Top right -->
    <polyline points="1150,20 1180,20 1180,50"/>
    <!-- Bottom left -->
    <polyline points="20,580 20,610 50,610"/>
    <!-- Bottom right -->
    <polyline points="1150,610 1180,610 1180,580"/>
  </g>
</svg>